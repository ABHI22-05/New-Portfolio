<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2.5" />

  <!-- Subtle corner ambient node -->
  <circle cx="50" cy="14" r="3" fill="#a855f7" opacity="0.8" />
  <circle cx="14" cy="50" r="2.5" fill="#06b6d4" opacity="0.8" />

  <!-- Stylized AI Terminal & Neural Node Glyph -->
  <!-- Left angle bracket < -->
  <path d="M 22 24 L 14 32 L 22 40" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />

  <!-- Center AI Core Diamond / Spark -->
  <polygon points="32,22 37,32 32,42 27,32" fill="url(#glowGrad)" opacity="0.9" filter="url(#neon)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />

  <!-- Right angle bracket > -->
  <path d="M 42 24 L 50 32 L 42 40" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
</svg>
